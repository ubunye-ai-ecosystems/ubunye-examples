name: deploy

# Deploys every example to Databricks as an Asset Bundle, then RUNS them.
#
# Running them is the point. A bundle that deploys but produces an empty table is
# a bundle that looks healthy and is broken — so each notebook ends in assertions,
# and `bundle run` fails the job when they do.
#
# Authenticates with a service principal (OAuth M2M). No personal access tokens:
# a PAT belongs to a human, expires with them, and carries their permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_jobs:
        description: "Run the jobs after deploying (not just deploy them)"
        type: boolean
        default: true
      engine:
        description: >-
          Test an unreleased engine: a pip URL (for example a branch archive .zip).
          Every notebook then installs it, with its own extras, instead of the
          released pin. Empty means the released pin.
        required: false
        default: ""

# NOTE ON THE `if:` GUARDS BELOW
# Every run step is gated on `github.event_name != 'workflow_dispatch' || inputs.run_jobs`
# and NOT on `inputs.run_jobs != false`, which is what it used to say and which was
# wrong in the quietest possible way.
#
# `inputs` only exists for a manual dispatch. On a push it is empty, GitHub coerces
# empty to false, so `inputs.run_jobs != false` evaluated to FALSE on every push and
# all ten run steps skipped. The job still went green in 25 seconds, because deploying
# a bundle succeeds whether or not the pipelines inside it work.
#
# That is the exact failure portability.yml exists to prevent, and it lived here for
# two months: a green tick that meant "the upload worked", never "the examples ran".

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never kill a half-finished deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Check for workspace credentials
        id: creds
        # A fork has no secrets. Skip cleanly rather than failing red and teaching
        # contributors to ignore a red build.
        run: |
          if [[ -n "${DATABRICKS_HOST}" && -n "${DATABRICKS_CLIENT_ID}" && -n "${DATABRICKS_CLIENT_SECRET}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Databricks credentials — skipping deploy."
          fi

      - name: Test another engine (only when a dispatch names one)
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.engine != ''
        env:
          ENGINE_URL: ${{ inputs.engine }}
        # The bundle deploys the working tree, so rewriting each notebook's pin here
        # is all it takes; the repo's notebooks keep the released pin.
        run: |
          python - <<'PY'
          import os, pathlib, re
          url = os.environ["ENGINE_URL"]
          pin = re.compile(r'"ubunye-engine\[([a-z,]+)\]==[0-9.]+"')
          changed = 0
          for path in sorted(pathlib.Path("examples").rglob("notebooks/*.py")):
              text = path.read_text(encoding="utf-8")
              new, n = pin.subn(lambda m: f'"ubunye-engine[{m.group(1)}] @ {url}"', text)
              if n:
                  path.write_text(new, encoding="utf-8")
                  changed += n
          assert changed, "no engine pin found to replace"
          print(f"{changed} notebooks now install {url}")
          PY
          echo "### Databricks ran engine: $ENGINE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate
        if: steps.creds.outputs.ok == 'true'
        run: databricks bundle validate --target ci

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: databricks bundle deploy --target ci

      - name: Run — 01 · ingest structured (tables + SQL)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        run: databricks bundle run ingest_tables_sql --target ci

      - name: Run — 02 · ingest structured (REST API)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        run: databricks bundle run ingest_rest_api --target ci

      - name: Run — 03 · ingest unstructured (text + files)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        run: databricks bundle run ingest_unstructured --target ci

      - name: Run — 04 · ML (features -> training -> inference)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        # Three tasks with real dependencies: if the model fails its quality gate,
        # nothing is registered, inference has nothing to load, and this fails.
        # That is correct. Scoring with an unvetted model is worse than not scoring.
        run: databricks bundle run ml_taxi_fare --target ci

      - name: Run — 05 · RAG (embed -> retrieve -> answer)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        run: databricks bundle run rag_documents --target ci

      - name: Run — 06 · distillation (LLM labels -> DistilBERT learns)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        # The slowest job by far: fine-tuning on CPU takes about ten minutes.
        run: databricks bundle run finetune_llm --target ci

      - name: Run — 07 · data quality (contract, quarantine, fail loudly)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        run: databricks bundle run data_quality --target ci

      - name: Run — 08 · model monitoring (drift, decay, rollback)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        # Must come after 04: it monitors 04's model and reads its feature table.
        # It deliberately registers a broken model and rolls it back, so it leaves
        # the registry with a healthy production version — 04's inference task on
        # the next run still has something to load. The notebook asserts that.
        run: databricks bundle run model_monitoring --target ci

      - name: Run — 10 · frameworks (sklearn vs PyTorch vs TensorFlow)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        # Must come after 04: all three trainers read its feature table. The three
        # trainers run in parallel and each installs a DIFFERENT framework —
        # TensorFlow needs numpy<2, which sklearn and MLflow cannot live with, so
        # they cannot share one environment. The task is the unit of isolation.
        run: databricks bundle run ml_frameworks --target ci

      - name: Run — 11 · run anywhere (the same task, on Databricks)
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_jobs)
        # The bundle has always had this job; deploy.yml never ran it, so its Databricks
        # run was proven by hand and not enforced. The portability matrix asserts that
        # local, Docker, Kubernetes and s3a:// agree with each other; this is the run
        # that makes Databricks agree with them too.
        run: databricks bundle run run_anywhere --target ci
